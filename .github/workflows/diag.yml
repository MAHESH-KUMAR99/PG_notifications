name: Diagnostic

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diag.yml", "diag.py"]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u diag.py
      - name: Save result
        run: |
          git config user.name "notices-bot"
          git config user.email "notices-bot@users.noreply.github.com"
          git add diag_result.json
          git commit -m "diagnostic result" && git pull --rebase -X theirs && git push
