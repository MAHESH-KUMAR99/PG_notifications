name: Watchdog

# Every hour: if the main job has not produced data for 45+ minutes
# (stuck, disabled by GitHub, or crashed), restart it and send a Telegram alert.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Is data fresh?
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          age=$(python3 - <<'PY'
          import json, datetime
          d = json.load(open("notices.json", encoding="utf-8"))
          t = datetime.datetime.fromisoformat(d.get("last_run_utc", "2000-01-01T00:00:00"))
          print(int((datetime.datetime.utcnow() - t).total_seconds() / 60))
          PY
          )
          echo "last run was $age minutes ago"
          if [ "$age" -gt 45 ]; then
            gh workflow enable "PG notices" || true
            gh workflow run "PG notices"
            if [ -n "$TG_BOT_TOKEN" ]; then
              curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                -d chat_id="$TG_CHAT_ID" \
                -d text="WATCHDOG: notices job was stale ($age min). Restarted it."
            fi
          fi
