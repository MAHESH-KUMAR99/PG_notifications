name: PG notices

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check all sources
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u monitor.py
      - name: Save data
        run: |
          git config user.name "notices-bot"
          git config user.email "notices-bot@users.noreply.github.com"
          git add notices.json
          git diff --cached --quiet || (git commit -m "update notices" && git pull --rebase -X theirs && git push)
      - name: Build site
        run: |
          mkdir -p site
          python monitor.py --html-only
          cp pg_notices.html site/index.html
          cp notices_merged.json site/notices.json
          cp feed.xml site/feed.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
